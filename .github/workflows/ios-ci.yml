name: iOS - Capturas UI y build

# Ajustado al proyecto SabiasQue (Reto 3).
env:
  PROJECT: SabiasQue.xcodeproj
  SCHEME: SabiasQue
  APP_NAME: SabiasQue

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:            # te permite lanzarlo a mano desde la pestaña Actions

# Si haces varios push seguidos, cancela los runs viejos y solo corre el ultimo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # JOB 0: pregunta al runner que simuladores tiene instalados de
  #        verdad. Los nombres de dispositivo (ej. "iPhone SE (3rd
  #        generation)") cambian entre versiones de Xcode, y si el
  #        que pediste ya no existe en la imagen del runner,
  #        xcodebuild falla con "Unable to find a device matching...".
  #        Este job arma la lista de dispositivos en tiempo real.
  # ---------------------------------------------------------------
  detectar-dispositivos:
    runs-on: macos-15
    outputs:
      dispositivos: ${{ steps.listar.outputs.dispositivos }}
    steps:
      - name: Mostrar version de Xcode disponible
        run: xcodebuild -version
      - name: Listar simuladores de iPhone disponibles (diagnostico)
        run: xcrun simctl list devices available
      - id: listar
        name: Elegir un simulador chico, uno estandar y uno grande
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess

          salida = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]
          )
          data = json.loads(salida)

          nombres = []
          for runtime, dispositivos in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in dispositivos:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      nombres.append(d["name"])

          nombres = sorted(set(nombres))
          print("Simuladores de iPhone encontrados:", nombres)

          def buscar(*claves_incluye, excluye=()):
              for n in nombres:
                  if all(c in n for c in claves_incluye) and not any(e in n for e in excluye):
                      return n
              return None

          chico = buscar("SE") or buscar("mini")
          grande = buscar("Pro Max") or buscar("Plus")
          estandar = buscar("iPhone", excluye=("Pro", "Plus", "SE", "mini"))

          elegidos = [n for n in [chico, estandar, grande] if n]
          elegidos = list(dict.fromkeys(elegidos))  # sin duplicados, conserva el orden

          # Red de seguridad: si no se pudo identificar ninguno de los tres
          # por nombre, se usan los primeros que haya disponibles.
          if not elegidos:
              elegidos = nombres[:3]

          if not elegidos:
              raise SystemExit("No se encontro ningun simulador de iPhone disponible en el runner.")

          print("Dispositivos elegidos para la matriz:", elegidos)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"dispositivos={json.dumps(elegidos)}\n")
          PYEOF

  # ---------------------------------------------------------------
  # JOB 1: corre los UI tests en varios simuladores y sube capturas
  # ---------------------------------------------------------------
  capturas:
    needs: detectar-dispositivos
    runs-on: macos-15
    strategy:
      fail-fast: false          # si falla un simulador, los demas siguen corriendo
      matrix:
        dispositivo: ${{ fromJson(needs.detectar-dispositivos.outputs.dispositivos) }}
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar version de Xcode disponible
        run: xcodebuild -version
      - name: Correr UI tests en ${{ matrix.dispositivo }}
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ matrix.dispositivo }},OS=latest" \
            -resultBundlePath "TestResults.xcresult" \
            -quiet
      - name: Extraer capturas del bundle de resultados
        if: always()            # importante: corre aunque el test falle, ahi es cuando mas sirven
        run: |
          brew install chargepoint/xcparse/xcparse
          mkdir -p capturas
          xcparse screenshots "TestResults.xcresult" capturas --test
      - name: Subir capturas como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # nombre unico por dispositivo (los espacios y parentesis no se permiten bien)
          name: capturas-${{ strategy.job-index }}
          path: capturas
          retention-days: 14
      - name: Subir el .xcresult completo (util para depurar fallos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ strategy.job-index }}
          path: TestResults.xcresult
          retention-days: 7

  # ---------------------------------------------------------------
  # JOB 2: genera un .ipa SIN FIRMAR para instalarlo en tu iPhone
  #        con Sideloadly / AltStore usando tu Apple ID gratuito
  # ---------------------------------------------------------------
  ipa-sin-firmar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Archive sin firma de codigo
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
      - name: Empaquetar en .ipa
        run: |
          # Un .ipa es literalmente un zip con una carpeta Payload adentro.
          mkdir -p build/Payload
          cp -r "build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" build/Payload/
          cd build
          zip -qr "$APP_NAME-unsigned.ipa" Payload
          ls -lh "$APP_NAME-unsigned.ipa"
      - name: Subir el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ipa-sin-firmar
          path: build/*.ipa
          retention-days: 14

# ---------------------------------------------------------------
# COMO USARLO
#
# 1. Este archivo ya esta en .github/workflows/ios-ci.yml dentro del zip.
#    Solo sube la carpeta SabiasQue completa a un repo nuevo de GitHub.
# 2. Haz el repo PUBLICO: en repos privados los minutos de macOS se
#    descuentan a 10x y el plan Free se agota rapidisimo.
# 3. El target SabiasQueUITests ya incluye un test (testFlujoCompletoDeLaApp)
#    que recorre categoria -> dato curioso -> otro dato y adjunta 3 capturas
#    con .lifetime = .keepAlways, asi que se guardan aunque el test pase.
# 4. El job "detectar-dispositivos" corre primero y le pregunta al runner
#    que simuladores de iPhone tiene instalados de verdad (con
#    "xcrun simctl list devices available"), en vez de asumir nombres fijos
#    como "iPhone SE (3rd generation)" que pueden no existir en la imagen
#    de Xcode que te toque. El paso "Listar simuladores..." de ese job
#    imprime la lista completa por si quieres ver que hay disponible.
# 5. Descarga los artifacts desde la pestana Actions del repo, en la
#    seccion "Artifacts" al final de cada run.
# 6. Para instalar el .ipa en tu iPhone desde Windows:
#    instala iTunes e iCloud (versiones de apple.com, NO las de Microsoft
#    Store), abre Sideloadly, conecta el iPhone por cable, arrastra el .ipa
#    e inicia sesion con tu Apple ID. La firma gratuita caduca a los 7 dias.
#    Despues, en el iPhone: Ajustes > General > VPN y admin. de dispositivos
#    > confia en tu perfil de desarrollador.
# ---------------------------------------------------------------
